name: wasm_run_flutter
description: |
  This library contains the necessary platform bindings for executing `package:wasm_run`'s Web Assembly executor.
  Uses Rust's wasmtime optimizing runtime or wasmi interpreter.
version: 0.1.0
homepage: https://github.com/juancastillo0/wasm_run
publish_to: none

topics:
  - wasm
  - interop
  - runtime
  - interpreter
  - ffi

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  wasm_run:
    path: ../wasm_run

dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^15.0.0
  very_good_analysis: ^6.0.0

# Flutter plugin configuration
# Native assets are bundled automatically via native_toolchain_rust build hooks in wasm_run
flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: WasmRunFlutterNative
      ios:
        dartPluginClass: WasmRunFlutterNative
      linux:
        dartPluginClass: WasmRunFlutterNative
      macos:
        dartPluginClass: WasmRunFlutterNative
      windows:
        dartPluginClass: WasmRunFlutterNative
      web:
        pluginClass: WasmRunFlutterWeb
        fileName: wasm_run_flutter_web.dart
