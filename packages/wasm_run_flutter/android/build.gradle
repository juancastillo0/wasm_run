// wasm_run_flutter Android build.gradle
//
// The native library is now built by wasm_run_native via Cargokit.
// This file is kept minimal as Flutter's FFI plugin mechanism will
// automatically link the native library from wasm_run_native.

group 'com.example.wasm_run_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk 21
    }

    // No externalNativeBuild needed - wasm_run_native handles it
}
