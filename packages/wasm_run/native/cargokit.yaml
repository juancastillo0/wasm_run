# Cargokit configuration for wasm_run_native
#
# This file configures how Cargokit builds the Rust code.
# See: https://github.com/irondash/cargokit

# Cargo build options per configuration
cargo:
  release:
    # Use stable toolchain for release builds
    toolchain: stable
    extra_flags: []
  debug:
    toolchain: stable
    extra_flags: []

# Precompiled binaries configuration (optional)
# Uncomment and configure to enable downloading precompiled binaries
# instead of building from source.
#
# To set up precompiled binaries:
# 1. Generate a key pair: dart run cargokit:generate_key
# 2. Add public key below and keep private key secret
# 3. Run precompile on CI for each platform
# 4. Set url_prefix to your GitHub releases URL
#
# precompiled_binaries:
#   url_prefix: https://github.com/juancastillo0/wasm_run/releases/download
#   public_key: <your-32-byte-hex-public-key>
