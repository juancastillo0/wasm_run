[package]
name = "wasm_run_dart"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
flutter_rust_bridge_codegen = "2.12.0"

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1.0.102"
once_cell = "1.21.4"
wat = "1.246.2"

rayon = "1.11.0"

wasi-common = "14.0.4"
cap-std = "2.0.2"
wasmtime = "14.0.4"
wasmtime-wasi = "14.0.4"

[features]
default = ["wasmtime", "wasi"]
wasi = []
wasmi = []
wasmtime = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }