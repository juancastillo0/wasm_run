[package]
name = "wasm_run_dart"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
flutter_rust_bridge = "2.12.0"

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1.0.102"
once_cell = "1.21.4"
wat = "1.247.0"

wasmi = "0.31.2"
wasi-common = { version = "2.0.2", optional = true } # the latest is 7.0.0, but it's not compatible with wasmi_wasi
cap-std = { version = "0.26.1", optional = true }
wasmi_wasi = { version = "0.31.2", optional = true }

[features]
default = ["wasmi", "wasi"]
wasi = ["dep:wasmi_wasi", "dep:wasi-common", "dep:cap-std"]
wasmi = []
wasmtime = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
