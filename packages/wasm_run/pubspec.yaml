name: wasm_run
description: Web Assembly executor. Uses Rust's wasmtime optimizing runtime or wasmi interpreter.
version: 0.1.0+2
homepage: https://github.com/juancastillo0/wasm_run

topics:
  - wasm
  - interop
  - runtime
  - interpreter
  - ffi

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

flutter:
  assets:
    - lib/assets/

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  ffi: ^2.1.3
  # flutter_rust_bridge v1 is required - v2 requires bridge code regeneration
  flutter_rust_bridge: ^1.82.6
  freezed_annotation: ^2.4.4
  wasm_interop: ^2.0.1
  logging: ^1.3.0
  collection: ^1.19.0
  uuid: ^4.5.1

dev_dependencies:
  # Note: ffigen and test have conflicting analyzer requirements
  # ffigen 16+ requires dart_style which needs analyzer ^6.x
  # test 1.29+ requires analyzer ^8.0.0
  # Using compatible versions until this is resolved upstream
  ffigen: ^15.0.0
  test: ^1.26.0
  build_runner: ^2.4.13
  freezed: ^2.5.2
  very_good_analysis: ^6.0.0
  wasm_run_example:
    path: example

# Hook dependencies for native_toolchain_rust
hooks:
  native_toolchain_rust: ^1.0.3
