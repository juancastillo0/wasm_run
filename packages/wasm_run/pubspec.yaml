name: wasm_run
description: Web Assembly executor. Uses Rust's wasmtime optimizing runtime or wasmi interpreter.
version: 0.1.0+2
homepage: https://github.com/juancastillo0/wasm_run

topics:
  - wasm
  - interop
  - runtime
  - interpreter
  - ffi

environment:
  sdk: ^3.10.0
resolution: workspace

flutter:
  assets:
    - lib/assets/
dependencies:
  meta: ^1.17.0
  ffi: ^2.2.0
  flutter_rust_bridge: ^2.12.0
  freezed_annotation: ^3.0.0
  logging: ^1.1.0
  collection: ^1.17.0
  web: ^1.1.1

dev_dependencies:
  ffigen: ^20.1.1
  test: ^1.30.0
  build_runner: ^2.4.4
  freezed: ^3.0.6
  very_good_analysis: ^10.0.0
  wasm_run_example:
    path: example
