name: wasm_run
description: Web Assembly executor. Uses Rust's wasmtime optimizing runtime or wasmi interpreter.
version: 0.1.0+2
homepage: https://github.com/juancastillo0/wasm_run

topics:
  - wasm
  - interop
  - runtime
  - interpreter
  - ffi

environment:
  sdk: ">=3.3.0 <4.0.0"

flutter:
  assets:
    - lib/assets/

dependencies:
  meta: ^1.15.0
  flutter_rust_bridge: ^2.11.1
  freezed_annotation: ^2.4.4
  logging: ^1.3.0
  collection: ^1.19.0
  web: ^1.0.0

dev_dependencies:
  ffigen: ^15.0.0
  test: ^1.26.0
  build_runner: ^2.4.13
  freezed: ^2.5.2
  very_good_analysis: ^6.0.0
  wasm_run_example:
    path: example
