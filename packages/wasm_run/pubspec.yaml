name: wasm_run
description: Web Assembly executor. Uses Rust's wasmtime optimizing runtime or wasmi interpreter.
version: 0.1.0+2
homepage: https://github.com/juancastillo0/wasm_run

topics:
  - wasm
  - interop
  - runtime
  - interpreter
  - ffi

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

flutter:
  assets:
    - lib/assets/

dependencies:
  code_assets: ^1.0.0
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.11.1
  freezed_annotation: ^3.1.0
  hooks: ^1.0.0
  logging: ^1.3.0
  meta: ^1.15.0
  native_toolchain_rust: ^1.0.3
  uuid: ^4.5.1
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.13
  ffigen: ^15.0.0
  freezed: ^3.2.4
  test: ^1.26.0
  very_good_analysis: ^10.0.0
  wasm_run_example:
    path: example
