name: wasm_run_workspace

hooks:
  user_defines:
    wasm_run:
      buildMode: checkout
      checkoutPath: packages/wasm_run/native/
      # buildMode: local
      # localPath: target/debug/wasm_run_dart.dll

publish_to: none
environment:
  sdk: ^3.10.0
workspace:
  - packages/wasm_run
  - packages/wasm_run/example
  - packages/wasm_run_flutter
  - packages/wasm_run_flutter/example
  - packages/dart_wit_component/wasm_wit_component
  - packages/dart_wit_component/wasm_wit_component/example
  - packages/build_rust_binaries
  - packages/wasm_packages/flutter_example
  - packages/wasm_packages/compression_rs
  - packages/wasm_packages/image_ops
  - packages/wasm_packages/rust_crypto
  - packages/wasm_packages/wasm_parser
  - packages/wasm_packages/y_crdt
  - packages/wasm_packages/typesql_parser
  - packages/wasm_packages/typesql_parser/typesql
  - packages/wasm_packages/typesql_parser/typesql_generator
dev_dependencies:
  melos: ^7.0.0
  very_good_analysis: ^10.0.0

melos:
  name: wasm_run
  repository: https://github.com/juancastillo0/wasm_run
  # packages:
  #   - packages/**

  command:
    bootstrap:
      hooks:
        pre: dart compile exe "scripts/config_api.dart"

  scripts:
    analyze:
      exec: flutter analyze . --no-fatal-infos
      description: Analyze a specific package in this project.

    check-format:
      exec: dart format --set-exit-if-changed .
      description: Check the format of a specific package in this project.

    format:
      exec: dart format .
      description: Format a specific package in this project.

    version:
      description: Updates version numbers in all build files
      run: bash scripts/version.sh

    build:wasm_examples:
      run: bash scripts/build-rust-wasm-examples.sh
      description: Build WASI and threads Rust WASM examples.

    test:
      run: melos run test:dart --no-select
      description: Run all Dart & Flutter tests in this project.

    test:dart:
      run: melos exec -c 1 -- "dart test test"
      description: Run Dart tests for a specific package in this project.
      packageFilters:
        flutter: false
        dir-exists: test
        ignore:
          - wasm_run_example
          - wasm_wit_component_example

    test:flutter:
      run: melos exec -c 1 --fail-fast -- "flutter test test"
      description: Run Flutter tests for a specific package in this project.
      packageFilters:
        flutter: true
        dir-exists: test

    test:coverage:
      run: cd packages/wasm_run && rm dart_test.yaml && flutter test --coverage ; cp example/dart_test.yaml dart_test.yaml
      description: Run all Dart & Flutter tests in this project and collect coverage.
